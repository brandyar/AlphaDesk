<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>سامانه مدیریت مشتریان آلفادسک (AlphaDesk CRM)</title>
    <meta name="description" content="پرتال یکپارچه مدیریت ارتباط با مشتریان، پیگیری مذاکرات، لیدهای سرد و ارزیابی عملکرد پرسنل آلفادسک" />
    <meta property="og:title" content="سامانه مدیریت مشتریان آلفادسک (AlphaDesk CRM)" />
    <meta property="og:description" content="پرتال یکپارچه مدیریت ارتباط با مشتریان، پیگیری مذاکرات، لیدهای سرد و ارزیابی عملکرد پرسنل آلفادسک" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="آلفادسک" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('alphadesk_theme');
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (themeMeta) themeMeta.setAttribute('content', '#121212');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-primary)] antialiased selection:bg-[#1DB954] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
